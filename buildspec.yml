version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "nodejs-cicd-demo"
    CONTAINER_NAME: "nodejs-cicd-demo"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - npm install

  pre_build:
    commands:
      - echo "Running tests"
      - npm test
      - echo "Logging in to ECR"
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 530467655702.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=530467655702.dkr.ecr.us-east-1.amazonaws.com/demoapplication-repo
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo "Building Docker image"
      - docker build --build-arg APP_VERSION=$IMAGE_TAG -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest .

  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Rendering imagedefinitions.json for the ECS deploy stage"
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - ecs/task-definition.json
